name: Modern Windows CI

on:
  pull_request:
    paths:
      - 'src/WGestures.Modern*/**'
      - 'tests/WGestures.Modern.Core.Checks/**'
      - 'WGestures.App/defaults/gestures.wg2'
      - '.github/workflows/modern-ci.yml'
      - 'installer/**'
  push:
    branches: [feat/modern-settings-shell]
    paths:
      - 'src/WGestures.Modern*/**'
      - 'tests/WGestures.Modern.Core.Checks/**'
      - 'WGestures.App/defaults/gestures.wg2'
      - '.github/workflows/modern-ci.yml'
      - 'installer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Run configuration regression checks
        run: dotnet run --project tests/WGestures.Modern.Core.Checks/WGestures.Modern.Core.Checks.csproj --configuration Release
      - name: Compile native settings application
        run: msbuild src/WGestures.Modern/WGestures.Modern.csproj /restore /p:Configuration=Release /p:Platform=x64 /m

      - name: Ensure Inno Setup is installed
        if: github.event_name != 'push'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $compiler)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Package and smoke-test Windows preview
        if: github.event_name != 'push'
        shell: pwsh
        run: ./installer/Build-Preview.ps1
      - name: Upload Windows installer
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: NyxicGestures-0.1.0-preview.1-win-x64-Setup
          path: artifacts/preview/*-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload portable package, source and checksums
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: NyxicGestures-0.1.0-preview.1-portable-and-source
          path: |
            artifacts/preview/*.zip
            artifacts/preview/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
